name: Claude Agent

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Only run if the issue/comment contains "@claude", it's NOT a PR, and the
    # author is trusted (prevents arbitrary outside users from triggering the agent)
    if: >-
      (contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')) &&
      github.event.issue.pull_request == null &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # 1. Prepare the Rules Variable
          RULES=""
          if [ -f CLAUDE.md ]; then
            echo "Found CLAUDE.md - Injecting rules into context."
            RULES=$(cat CLAUDE.md)
          else
            echo "No CLAUDE.md found. Proceeding with standard defaults."
          fi

          # 2. Construct the Prompt
          # Issue title/body come in via env vars (not interpolated into the script
          # text) so untrusted content can't break out of the quoted string here.
          PROMPT="PROJECT RULES (STRICTLY FOLLOW):
          $RULES

          ----------------

          TASK:
          Act as a senior developer. Fix the issue described in GitHub Issue #$ISSUE_NUMBER: $ISSUE_TITLE.

          CONTEXT:
          $ISSUE_BODY"

          # 3. Run Agent
          # We use the constructed $PROMPT variable inside the -p flag
          claude -p "$PROMPT" --dangerously-skip-permissions

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated changes by Claude Agent"
          title: "Fix: Automated resolution for Issue #${{ github.event.issue.number }}"
          body: |
            Automated fixes generated by Claude Code for Issue #${{ github.event.issue.number }}.
            
            **Verification:**
            - [ ] The agent followed the rules in `CLAUDE.md`.
            - [ ] The fix addresses the user's issue.
            
            Triggered by @${{ github.actor }}
          branch: "claude-fix-${{ github.event.issue.number }}"
          base: main