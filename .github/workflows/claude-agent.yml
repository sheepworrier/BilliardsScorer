name: Claude Agent

on:
  # Trigger when a new issue is opened or edited
  issues:
    types: [opened, edited]
  # Trigger when a comment is added to an issue
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Only run if the issue/comment contains "@claude" and it's NOT a pull request
    if: (contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')) && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting Claude Agent for Issue #${{ github.event.issue.number }}..."
          
          # -p passes the prompt text
          # --dangerously-skip-permissions allows the agent to edit files/run commands without waiting for a human "Yes"
          
          claude -p "Fix the issue described in GitHub Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. \n\n Context/Description: ${{ github.event.issue.body }}" --dangerously-skip-permissions