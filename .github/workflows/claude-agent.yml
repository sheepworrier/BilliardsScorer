name: Claude Agent

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Only run if the issue/comment contains "@claude" and it's NOT a PR
    if: (contains(github.event.issue.body, '@claude') || contains(github.event.comment.body, '@claude')) && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Agent (Fix Code)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # We tell Claude to ONLY fix the files, not worry about git
        run: |
          claude -p "Act as a senior developer. Fix the issue described in GitHub Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}. \n\n Context: ${{ github.event.issue.body }}" --dangerously-skip-permissions

      - name: Create Pull Request
        # This step detects the file changes made by Claude and creates the PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: automated changes by Claude Agent"
          title: "Fix: Automated resolution for Issue #${{ github.event.issue.number }}"
          body: |
            Automated fixes generated by Claude Code for Issue #${{ github.event.issue.number }}.
            
            Triggered by @${{ github.actor }}
          branch: "claude-fix-${{ github.event.issue.number }}"
          base: main